name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version Info ==="
          java -version
          echo "JAVA_HOME is: $JAVA_HOME"
          JAVA_VER_STRING=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected Java version string: $JAVA_VER_STRING"
          JAVA_MAJOR=$(echo "$JAVA_VER_STRING" | awk -F. '{if ($1 == "1") print $2; else print $1}')
          if [ -z "$JAVA_MAJOR" ]; then
            echo "ERROR: Failed to detect active Java major version."
            exit 1
          fi
          echo "Detected active Java major version: $JAVA_MAJOR"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Java major version is $JAVA_MAJOR, which is lower than 17."
            exit 1
          fi
          echo "Java verification successful: Java $JAVA_MAJOR is 17 or newer."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkeypair -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -storepass android \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: Failed to create ./debug.keystore"
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$TARGET_APK" ]; then
            echo "ERROR: Expected debug APK not found at $TARGET_APK"
            echo "Searching only inside app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 4 -name "*.apk" -print
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          if [ ! -f "$TARGET_APK" ]; then
            echo "ERROR: $TARGET_APK is not a regular file."
            exit 1
          fi
          if [ ! -s "$TARGET_APK" ]; then
            echo "ERROR: $TARGET_APK is empty."
            exit 1
          fi
          case "$TARGET_APK" in
            *.apk) ;;
            *) echo "ERROR: $TARGET_APK does not have .apk extension"; exit 1 ;;
          esac
          if [ "$TARGET_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "ERROR: Selected APK is not app/build/outputs/apk/debug/app-debug.apk"
            exit 1
          fi
          echo "Verified debug APK at $TARGET_APK ($(du -h "$TARGET_APK" | cut -f1))"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prep_asset
        run: |
          TEMP_DIR="${RUNNER_TEMP}/apk-release-asset"
          mkdir -p "$TEMP_DIR"
          RAW_REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SAFE_REPO_NAME=$(echo "$RAW_REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_-]+/-/g' | sed -E 's/^-+|-+$//g')
          if [ -z "$SAFE_REPO_NAME" ]; then
            SAFE_REPO_NAME="android-app"
          fi
          RELEASE_FILENAME="${SAFE_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          RELEASE_ASSET_PATH="${TEMP_DIR}/${RELEASE_FILENAME}"
          cp "app/build/outputs/apk/debug/app-debug.apk" "$RELEASE_ASSET_PATH"
          if [ ! -s "$RELEASE_ASSET_PATH" ]; then
            echo "ERROR: Failed to prepare release asset at $RELEASE_ASSET_PATH"
            exit 1
          fi
          echo "Prepared release asset: $RELEASE_ASSET_PATH"
          echo "asset_path=${RELEASE_ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${RELEASE_FILENAME}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prep_asset.outputs.asset_path }}
        run: |
          echo "Checking gh CLI version..."
          gh --version
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Release asset does not exist or is empty: $ASSET_PATH"
            exit 1
          fi
          case "$ASSET_PATH" in
            *.apk) ;;
            *) echo "ERROR: Release asset does not have .apk extension: $ASSET_PATH"; exit 1 ;;
          esac

          TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          cat << EOF > "${RUNNER_TEMP}/release-notes.md"
          ## Debug APK Build Notes
          - **Type:** Automatically generated debug APK
          - **Build Engine:** GitHub Actions
          - **Workflow Run Number:** Run #${GITHUB_RUN_NUMBER}
          - **Run Attempt:** Attempt #${GITHUB_RUN_ATTEMPT}
          - **Source Commit:** \`${GITHUB_SHA}\`
          - **Purpose:** Intended for testing and development verification
          - **Notice:** This is not a Play Store production release
          - **Signing:** Signed only with a temporary debug keystore
          EOF

          echo "Creating release $TAG for target commit $GITHUB_SHA..."
          gh release create "$TAG" "$ASSET_PATH" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes-file "${RUNNER_TEMP}/release-notes.md" \
            --latest

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_STATUS: ${{ steps.publish_release.outcome }}
          TAG: ${{ steps.publish_release.outputs.tag }}
          TITLE: ${{ steps.publish_release.outputs.title }}
          ASSET_NAME: ${{ steps.prep_asset.outputs.asset_name }}
        run: |
          echo "=== APK Delivery Report ==="
          if [ "$RELEASE_STATUS" = "success" ]; then
            echo "GitHub Release publishing succeeded!"
            RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
            echo "Release Tag: ${TAG}"
            echo "Release Title: ${TITLE}"
            echo "Release Page URL: ${RELEASE_URL}"
            echo "APK Asset Filename: ${ASSET_NAME}"

            gh release view "$TAG" || true

            cat << EOF >> "$GITHUB_STEP_SUMMARY"
          ## :rocket: Debug APK Build & Release Succeeded

          - **Release Title:** ${TITLE}
          - **Release Tag:** \`${TAG}\`
          - **APK Asset Filename:** \`${ASSET_NAME}\`
          - **GitHub Release Page:** [View Release and Download APK](${RELEASE_URL})

          ### Download Instructions
          - Download the APK directly from the **Assets** section on the release page.
          - The normal GitHub Actions artifact named \`app-debug-apk\` is also available as a backup under the workflow run summary.
          EOF
          else
            echo "::warning::GitHub Release publishing was skipped or encountered an issue. Outcome: ${RELEASE_STATUS}"
            echo "The APK build and Actions artifact upload succeeded."
            echo "Actions artifact 'app-debug-apk' remains available for download."

            cat << EOF >> "$GITHUB_STEP_SUMMARY"
          ## :warning: Debug APK Build Succeeded (Release Publishing Unavailable)

          - The debug APK was built successfully.
          - GitHub Actions artifact **\`app-debug-apk\`** is available for download directly from the summary of this workflow run.
          - Release publishing outcome was: \`${RELEASE_STATUS}\`.
          EOF
          fi
